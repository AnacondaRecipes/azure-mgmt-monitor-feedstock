{% set name = "azure-mgmt-monitor" %}
{% set version = "7.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: b75f536441d430f69ff873a1646e5f5dbcb3080a10768a59d0adc01541623816

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - wheel
    - python
    - pip
    - setuptools
  run:
    - python
    - isodate >=0.6.1
    - typing-extensions >=4.6.0
    - azure-common >=1.1
    - azure-mgmt-core>=1.5.0

test:
  imports:
    - azure
    - azure.mgmt
    - azure.mgmt.monitor
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Monitor Client Library for Python.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: Microsoft Azure Monitor Client Library for Python.
  dev_url: https://github.com/Azure/azure-sdk-for-python
  doc_url: https://github.com/Azure/azure-sdk-for-python
  
  


extra:
  recipe-maintainers:
    - tim-werner
